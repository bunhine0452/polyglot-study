# 임시 진단. 어느 러너 이미지가 Swift tools 6.2 를 받을 수 있는지 한 번에 확인한다.
# 결과를 pr-checks.yml 에 반영한 뒤 이 파일은 지운다.
name: _probe
on:
  push:
    branches: [docs/readme-status]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-14, macos-15, macos-latest, macos-26]
    runs-on: ${{ matrix.image }}
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: ${{ matrix.image }} 의 Xcode 와 Swift
        run: |
          echo "IMAGE=${{ matrix.image }} ImageOS=$ImageOS ImageVersion=$ImageVersion"
          newest=""
          for x in /Applications/Xcode*.app; do
            v=$(DEVELOPER_DIR="$x/Contents/Developer" swift --version 2>/dev/null | head -1)
            echo "  $x → ${v:-실패}"
            newest="$x"
          done
          echo "기본 swift: $(swift --version 2>&1 | head -1)"
