name: PR checks

# 모든 PR 에서 항상 트리거한다 — `paths:` 로 packtool-validate 잡만 골라 걸지 않는다.
# 필수 체크(branch protection required status check)를 path 필터가 있는 워크플로에
# 걸면, 그 필터에 안 걸리는 PR 은 체크가 영영 "대기 중"으로 남아 머지가 막히는
# GitHub Actions 의 알려진 함정이다. 대신 packtool-validate 잡 **내부**에서
# scripts/ci-validate-packs.sh 가 diff 를 보고 packs 변경이 없으면 빠르게 통과한다 —
# "필수 체크"인 것과 "packs 변경 PR 에서만 실제로 게이트가 선다"가 동시에 성립한다.
# 자세한 설계 근거는 docs/ci.md.
"on":
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 게이트 1/3 — 전체 스위트. LearnKit 과 Tools 를 **별도 잡으로 갈라** 병렬로 돌린다.
  #
  # 한 잡에 몰아넣었더니 30분 타임아웃에 걸려 취소됐다(실측 2026-09-07, 30분 44초에
  # swiftpm-testing 이 아직 돌고 있었다). 로컬은 21초인데 러너는 콜드 빌드라 다르다 —
  # 특히 Swift 채점 테스트가 SwiftPM 패키지를 매번 새로 굽는다.
  #
  # 타임아웃만 올리지 않고 가른 이유는 신호다. 한 잡이면 어느 쪽이 느린지·어느 쪽이
  # 깨졌는지 로그를 뒤져야 알지만, 갈라 두면 체크 이름이 바로 말해 준다.
  # ── 게이트 1/4 — RunnerKit (프로세스를 실제로 띄우는 스위트) ────────────────
  #
  # **직렬로 돌린다.** 병렬이면 러너에서 물린다 — 실측(2026-09-07):
  #   병렬        25분 상한 초과, 로그 19분간 침묵, 34개 스위트 중 0개 종료
  #   --no-parallel  8분 47초 통과
  # 같은 코드·같은 러너다. 특정 테스트가 매달리는 게 아니라 동시에 수십 개가
  # 로그인 셸(`zsh -lic`)·sandbox-exec·swiftc 를 띄우면서 물린다. RLIMIT_NPROC 이
  # 프로세스 트리가 아니라 uid 전체를 센다는 실측(HANDOFF.md)과 맞물리는 자리다.
  #
  # 회피가 아니라 이 스위트에 맞는 실행 방식이다 — 사용자 코드를 가두는 우리를
  # 검사하는 테스트라 하나씩 돌리는 게 맞다. 나머지 잡은 병렬 그대로다.
  swift-test-runnerkit:
    name: swift test (RunnerKit · 직렬)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 툴체인 확인
        run: scripts/ci-assert-toolchain.sh
      - run: swift test --package-path Packages/LearnKit --filter RunnerKitTests --no-parallel

  # ── 게이트 2/4 — LearnKit 나머지 (병렬) ────────────────────────────────────
  #
  # RunnerKit 만 떼어낸 이유는 신호다. 한 잡이면 어느 쪽이 느린지·깨졌는지 로그를
  # 뒤져야 알지만, 갈라 두면 체크 이름이 바로 말해 준다.
  swift-test-learnkit:
    name: swift test (LearnKit)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 툴체인 확인
        run: scripts/ci-assert-toolchain.sh
      - run: swift test --package-path Packages/LearnKit --skip RunnerKitTests

  swift-test-tools:
    name: swift test (Tools)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 툴체인 확인
        run: scripts/ci-assert-toolchain.sh
      - run: swift test --package-path Tools

  # 게이트 2/3 — 앱 번들 조립 + 서명(ad-hoc). App/Scripts/build-app.sh 는 App/** 소유
  # 세션의 산출물이라 여기서는 그대로 호출만 한다.
  build-app:
    name: build-app.sh
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 툴체인 확인
        run: scripts/ci-assert-toolchain.sh
      - run: App/Scripts/build-app.sh

  # 게이트 3/3 — packtool validate. packs 를 건드리지 않는 PR 에서는 스크립트가
  # 빠르게 통과시킨다({#toolchain-skip-policy} 는 이 잡이 아니라 packtool 자체의
  # --allow-missing-toolchain 기본값 정책이다 — 이 잡은 그 플래그를 절대 넘기지
  # 않는다. 즉 실행 게이트까지 실제로 돈 결과만 필수 체크로 센다).
  packtool-validate:
    name: packtool validate (packs)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 베이스 대비 diff 를 보려면 병합 커밋 하나만으로는 부족하다.
          fetch-depth: 0
      - name: 툴체인 확인
        run: scripts/ci-assert-toolchain.sh
      - run: scripts/ci-validate-packs.sh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: JUnit 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packtool-validate-reports
          path: .build/ci-reports/packtool/*.xml
          if-no-files-found: ignore

# ── 태그 푸시 릴리스 파이프라인은 여기 없다 ──────────────────────────────────
#
# {#release-ci} 는 "PR 게이트 3종" + "태그 푸시 시 공증·appcast" 를 함께 묶은
# 플래너 항목이다. 후자({#notarize-staple-dmg}·{#sparkle-appcast})는 병렬 세션이
# 진행 중이라 이 워크트리의 몫이 아니다 — 자리만 남긴다. 실제 릴리스 워크플로가
# 생기면 `on: push: tags: ['v*']` 트리거를 가진 별도 `.github/workflows/release.yml`
# 로 만들어질 것이다. 이 파일에 태그 트리거를 추가하지 않는다.
