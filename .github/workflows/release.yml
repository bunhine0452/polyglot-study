name: release

# 태그를 밀면 앱을 굽고 서명한 appcast 와 함께 배포한다 — {#release-ci}.
#
# 로컬 릴리스와 이 워크플로의 유일한 차이는 **서명 키를 어디서 꺼내는가** 다.
# 로컬은 로그인 키체인, 여기는 저장소 시크릿 `SPARKLE_ED_PRIVATE_KEY` 를 stdin 으로 받는다
# (`release.sh --ed-key-file -`). 키가 파일로도 인자로도 로그로도 남지 않는다.
#
# 시크릿의 내용은 `generate_keys -x <file>` 이 내보내는 것 그대로다 — **32바이트 시드의
# base64**(44자)이지 64바이트 키쌍이 아니다(실측 2026-09-07). 형식이 틀리면
# `Failed to decode private and public keys from secret data` 로 죽는다.
#
# 키체인 경로가 CI 에서 안 되는 이유는 실측이다(2026-09-07): 분리된 프로세스에서는
# 키체인 승인 대화상자(SecurityAgent)를 띄울 수 없어 errSecUserCanceled(-128) 로
# 실패하는데, Sparkle 은 그것을 "Private key not found in the Keychain" 으로 찍는다.
# 헤드리스 러너는 언제나 그 상태다.
#
# **공증한다** — {#notarize-staple-dmg}. 러너에는 키체인이 비어 있으므로 Developer ID
# 인증서를 시크릿에서 임시 키체인으로 넣고, 잡이 끝나면 지운다. 공증 자격증명은
# **Apple ID + 앱 전용 암호**를 notarytool 에 직접 넘긴다. 헤드리스 러너에서 막히는 것은
# 키체인 *프로파일* 경로뿐이다(errSecUserCanceled(-128) — EdDSA 키에서 겪은 그 벽과 같다).
# 자격증명을 인자로 주는 경로는 키체인을 아예 타지 않아 멀쩡히 돈다.
#
# 필요한 시크릿 넷 — 하나라도 없으면 굽기 전에 실패한다:
#   APPLE_CERTIFICATE           Developer ID Application 인증서 .p12 의 base64.
#                               인증서와 개인 키가 **둘 다** 들어 있어야 한다 — 키만 담긴
#                               .p12 는 import 는 되는데 find-identity 에 신원이 안 잡힌다
#                               (실측 2026-09-07: 키체인의 "개인 키" 행을 내보내면 그렇게 된다.
#                               제대로 된 것은 pkcs7-encryptedData 컨테이너를 하나 갖는다).
#   APPLE_CERTIFICATE_PASSWORD  그 .p12 를 내보낼 때 건 암호
#   APPLE_ID                    공증에 쓸 Apple ID (이메일)
#   APPLE_PASSWORD              그 계정의 **앱 전용 암호** (계정 비밀번호가 아니다)
#   APPLE_TEAM_ID               10자 팀 식별자
#
# notarize.sh 는 App Store Connect API 키 경로도 지원한다 — 그쪽을 쓰려면
# NOTARY_API_KEY_P8_BASE64 / NOTARY_API_KEY_ID / NOTARY_API_ISSUER_ID 를 대신 넘기면 된다.

"on":
  push:
    tags: ["v*"]

# 같은 태그를 다시 밀어도 두 릴리스가 gh-pages 를 동시에 밀지 않게 한다.
# cancel-in-progress 는 **쓰지 않는다** — 릴리스는 중간에 끊기면 gh-pages 와
# GitHub Release 가 어긋난 채로 남는다.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 굽고 배포
    # macos-26 이어야 한다 — macos-14 는 Swift 5.10, macos-15 는 6.1.2 라 tools 6.2 를 못 받는다.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: 체크아웃 (전체 이력)
        uses: actions/checkout@v4
        with:
          # CFBundleVersion 을 커밋 수에서 뽑으므로 얕은 클론이면 안 된다.
          fetch-depth: 0

      - name: 버전 뽑기
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 프리릴리스 판정은 semver 의 하이픈이다 — 0.1.0-alpha.1 은 프리, 0.1.0 은 정식.
          case "$VERSION" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "==> $TAG → $VERSION"

      - name: 툴체인 확인
        run: |
          swift --version
          ./scripts/ci-assert-toolchain.sh

      - name: 서명 인증서를 임시 키체인에 넣는다
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD 시크릿이 없다." \
                 "이게 없으면 ad-hoc 으로 떨어지고 공증이 거부된다."
            exit 1
          fi
          # 러너 전용 임시 키체인. 로그인 키체인을 건드리지 않고, 잡이 끝나면 지운다.
          # 키체인 암호는 이 잡 안에서만 사는 값이라 run_id 로 충분하다.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="${{ github.run_id }}-${{ github.run_attempt }}"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 자동 잠금을 끈다 — 빌드가 길어져 잠기면 서명이 중간에 실패한다.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/cert.p12"
          (umask 077; printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT")
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # 이게 없으면 codesign 이 키를 쓸 때 승인 대화상자를 띄우려 하고, 헤드리스
          # 러너에서는 그것이 곧 실패다(errSecUserCanceled).
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # 검색 목록에 넣어야 build-app.sh 의 `security find-identity` 가 본다.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          echo "==> 사용 가능한 신원"
          security find-identity -v -p codesigning
          # build-app.sh 는 이름으로 고른다. 없으면 조용히 ad-hoc 으로 떨어지므로 여기서 막는다.
          security find-identity -v -p codesigning | grep -q "Developer ID Application:" \
            || { echo "::error::임포트했는데 Developer ID Application 신원이 안 보인다"; exit 1; }

      - name: Sparkle 도구 준비
        run: swift package resolve --package-path App

      - name: gh-pages 를 산출물 디렉터리로 받는다
        # generate_appcast 는 이 디렉터리를 통째로 훑어 appcast 를 만든다. 기존 아카이브가
        # 함께 있어야 옛 버전 항목이 피드에서 사라지지 않는다.
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: 릴리스 굽기 (앱 → zip → 서명된 appcast)
        env:
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          # notarize.sh 가 읽는다. 암호는 로그에 찍지 않는다 — Actions 가 시크릿을
          # 마스킹하지만, 스크립트도 어느 경로로 인증하는지만 출력한다.
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_APPLE_PASSWORD" ] \
             || [ -z "$NOTARY_TEAM_ID" ]; then
            echo "::error::공증 자격증명 시크릿이 없다 (APPLE_ID / APPLE_PASSWORD /" \
                 "APPLE_TEAM_ID). APPLE_PASSWORD 는 appleid.apple.com 의 앱 전용 암호다."
            exit 1
          fi
          if [ -z "$ED_KEY" ]; then
            echo "::error::시크릿 SPARKLE_ED_PRIVATE_KEY 가 없다. 이게 없으면 서명 없는 appcast 가 나가고" \
                 "이미 설치된 앱이 업데이트를 거부한다."
            exit 1
          fi
          # 키는 stdin 으로만 흘린다 — 인자·파일·로그 어디에도 남기지 않는다.
          printf '%s' "$ED_KEY" | ./App/Scripts/release.sh \
            --version "${{ steps.version.outputs.version }}" \
            --output "$GITHUB_WORKSPACE/site" \
            --link "https://github.com/${{ github.repository }}" \
            --ed-key-file - \
            --notarize

      - name: 랜딩 페이지 렌더
        run: |
          ./App/Scripts/render-page.sh \
            --version "${{ steps.version.outputs.version }}" \
            --archive "site/Polyglot-${{ steps.version.outputs.version }}.zip" \
            --out site/index.html

      - name: 산출물 확인
        # release.sh 가 이미 서명과 length 를 단언한다. 여기서는 **배포되는 트리**가
        # 기대한 모양인지만 본다 — old_updates/ 가 섞여 나가면 옛 아카이브가 두 벌 올라간다.
        run: |
          set -e
          rm -rf site/old_updates
          test -f "site/Polyglot-${{ steps.version.outputs.version }}.zip"
          test -f "site/Polyglot-${{ steps.version.outputs.version }}.dmg"
          test -f site/appcast.xml
          test -f site/index.html
          grep -q "sparkle:edSignature=\"[^\"]\+\"" site/appcast.xml \
            || { echo "::error::appcast 에 서명이 없다"; exit 1; }
          echo "==> 배포될 파일"
          ls -1 site

          # 사람이 실제로 받는 파일을 풀어서 확인한다. 스테이플이 zip 보다 뒤에 왔거나
          # ditto 가 Sparkle.framework 구조를 뭉갰으면 여기서 잡힌다 — 랜딩 페이지에
          # "그냥 열면 됩니다" 라고 적어 놓고 정작 Gatekeeper 가 막는 사태를 막는 게이트다.
          VERIFY_DIR="$(mktemp -d)"
          ditto -x -k "site/Polyglot-${{ steps.version.outputs.version }}.zip" "$VERIFY_DIR"
          xcrun stapler validate "$VERIFY_DIR/Polyglot.app"
          codesign --verify --deep --strict "$VERIFY_DIR/Polyglot.app"
          # 공증된 배포본이면 "accepted / source=Notarized Developer ID" 여야 한다.
          spctl --assess --type execute -vv "$VERIFY_DIR/Polyglot.app"
          rm -rf "$VERIFY_DIR"
          echo "==> 배포본(zip) 공증·스테이플 확인됨"

          # DMG 도 같은 수준으로 확인한다 — {#dmg-notarize} 의 완료 기준은 **DMG 단독으로**
          # stapler validate 가 통과하는 것이다. 평가 타입이 앱과 다르다: DMG 는 실행형이
          # 아니라 "연 파일" 이라 --type open --context context:primary-signature 를 쓴다.
          DMG_FILE="site/Polyglot-${{ steps.version.outputs.version }}.dmg"
          xcrun stapler validate "$DMG_FILE"
          codesign --verify --strict "$DMG_FILE"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_FILE"
          echo "==> DMG 공증·스테이플 확인됨"

          # DMG 는 GitHub Release 자산으로만 올라간다({#dmg-notarize}) — Sparkle 피드는
          # zip 만 가리키므로, DMG 를 gh-pages 커밋 대상에 남겨 매 릴리스마다 그 큰 이력을
          # 반복해서 쌓을 이유가 없다. 뒤의 gh-pages 발행 단계 전에 러너 임시 디렉터리로
          # 옮겨 두고, GitHub Release 단계에서 거기서 집어 올린다.
          mkdir -p "$RUNNER_TEMP/dist"
          mv "$DMG_FILE" "$RUNNER_TEMP/dist/"
          echo "==> DMG 를 gh-pages 발행 대상에서 뺐다 → $RUNNER_TEMP/dist"


      - name: gh-pages 발행
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 발행을 건너뛴다."
            exit 0
          fi
          git commit -m "release: ${{ steps.version.outputs.version }} — 아카이브와 appcast"
          git push origin gh-pages

      - name: 임시 키체인 정리
        # 실패해도 반드시 돈다. 러너는 매번 새로 뜨지만, 키체인을 잡 안에서 닫는 것을
        # 습관으로 둔다 — self-hosted 로 옮기는 순간 이게 없으면 키가 남는다.
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
            echo "임시 키체인 삭제됨"
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(mktemp)"
          {
            echo "**Polyglot Study ${{ steps.version.outputs.version }}**"
            echo
            echo "받기: https://bunhine0452.github.io/polyglot-study/ (자동 업데이트 경로)"
            echo "또는 아래 DMG 를 내려받아 열고 Polyglot.app 을 응용 프로그램 폴더로 옮기세요."
            echo
            echo "macOS 14 이상 · Apple Silicon. **Developer ID 서명 + 애플 공증**을 거쳤으므로"
            echo "받아서 그냥 열면 됩니다 — Gatekeeper 우회 절차가 필요 없습니다. zip 과 DMG"
            echo "둘 다 같은 앱이고 어느 쪽으로 받아도 동일합니다 — zip 은 이후 앱 안의"
            echo "자동 업데이트가 받는 형태와 같고, DMG 는 처음 설치할 때 더 익숙한 형태입니다."
            echo
            echo "자동 업데이트는 EdDSA 서명으로 검증되며 이 문제와 무관합니다."
          } > "$NOTES"
          FLAGS=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Polyglot Study ${{ steps.version.outputs.version }}" \
            --notes-file "$NOTES" $FLAGS \
            "site/Polyglot-${{ steps.version.outputs.version }}.zip" \
            "$RUNNER_TEMP/dist/Polyglot-${{ steps.version.outputs.version }}.dmg"
